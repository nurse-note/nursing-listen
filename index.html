<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>간호 암기 목록</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F6FA8">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="간호 암기 듣기">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F5F8;--surface:#FFFFFF;--surface-2:#EAF0F5;--line:#D7E0E8;--ink:#14304A;--muted:#5A6C7D;
  --accent:#1F6FA8;--accent-ink:#FFFFFF;--accent-soft:#DCEBF6;
  --say:#0F5E8C;--say-soft:#E6F1F9;--sup:#7A4FB0;--sup-soft:#EFE7F8;
  --crit:#C23B35;--fix:#B9780A;--fix-soft:#FBEFD3;--chk:#1B8A5A;--chk-soft:#DDF3E8;
  --star:#D99A00;--cur:#FFF6D6;--cur-line:#E3AE4A;
  --shadow:0 1px 2px rgba(20,48,74,.06),0 6px 18px rgba(20,48,74,.07);
  --font-body:"Malgun Gothic","맑은 고딕","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1620;--surface:#172230;--surface-2:#1F2D3D;--line:#2A3B4D;--ink:#E5EDF5;--muted:#94A7B9;
  --accent:#6DB2E8;--accent-ink:#0B1722;--accent-soft:#1C3347;
  --say:#8CC8F0;--say-soft:#18304A;--sup:#C3A2EC;--sup-soft:#2C2240;
  --crit:#EF7D77;--fix:#E3AE4A;--fix-soft:#3B2E14;--chk:#4CC38A;--chk-soft:#173A2B;
  --star:#F0B93A;--cur:#33290F;--cur-line:#E3AE4A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1*max(14px,env(safe-area-inset-left,0px)));padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.top-in{max-width:680px;margin:0 auto}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted);margin:2px 0 8px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;min-height:40px;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip small{opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}

main{padding:12px 0 calc(150px + env(safe-area-inset-bottom,0px))}
body.home main{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}

.hrow{display:flex;align-items:center;gap:8px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;min-height:34px;font-size:13.5px;font-weight:600;color:var(--accent);flex:0 0 auto}
.deck{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.deck .dn{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.deck .dn i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}
.deck .ds{font-size:13px;color:var(--muted);margin-top:3px}
.deck .dm{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.deck .dm b{color:var(--ink)}
.vwarn{background:var(--fix-soft);border:1px solid var(--fix);color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.6}
.vwarn b{color:var(--fix)}
.vwarn ol{margin:6px 0 0;padding-left:20px}
.vwarn code{font-family:var(--font-mono);font-size:12.5px;background:var(--surface);border-radius:6px;padding:1px 5px;word-break:break-all}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.acct:empty{display:none}
.acct-t{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px}
.acct-st{font-size:12.5px;color:var(--muted)} .acct-st.ok{color:var(--chk)} .acct-st.bad{color:var(--crit)}
.acct-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.abtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;min-height:42px;font-weight:600;font-size:14px}
.abtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.abtn.ghost{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}
.abtn:disabled{opacity:.5}
.acct-form{display:grid;gap:8px;margin-top:10px}
.ainp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-height:42px;font-size:15px;width:100%}
.acct-err{color:var(--crit);font-size:13px;margin:8px 0 0}
.src{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.src a{color:var(--accent)}
/* settings */
details.set{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow)}
details.set summary{list-style:none;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.set summary::-webkit-details-marker{display:none}
details.set summary span{font-weight:400;font-size:12px;color:var(--muted)}
.set-body{padding:0 14px 14px;display:grid;gap:12px}
.srow{display:grid;gap:5px}
.srow>label,.srow>.lab{font-size:12.5px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1 1 auto;border:0;background:transparent;padding:7px 10px;font-size:13px;min-height:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
.tg small{display:block;font-size:12px;color:var(--muted)}
.sw{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
.note{font-size:12.5px;color:var(--muted);margin:0}
.note.warn{color:var(--fix)}

/* section heads */
.sh{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sh::after{content:"";flex:1;height:1px;background:var(--line)}

/* items */
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px 12px;margin-bottom:8px;box-shadow:var(--shadow);scroll-margin:150px 0 170px;transition:background .25s,border-color .25s}
.item.cur{background:var(--cur);border-color:var(--cur-line);box-shadow:0 0 0 2px var(--cur-line)}
.ih{display:flex;align-items:center;gap:8px}
.no{font-family:var(--font-mono);font-weight:600;font-size:14px;min-width:38px;height:28px;padding:0 8px;border-radius:8px;background:var(--surface-2);display:inline-grid;place-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.no.crit{color:var(--crit)}
.kind{font-size:12px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);flex:0 0 auto}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.ib.star[aria-pressed="true"]{color:var(--star)}
.ib.star[aria-pressed="true"] svg{fill:currentColor}
.it{margin:8px 2px 0;font-size:15.5px}
.it ul{margin:2px 0 0;padding-left:20px}
.it li{margin:1px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 2px 0;font-size:15px}
.kv dt{color:var(--muted);font-size:13px;padding-top:1px}
.kv dd{margin:0}
.lines{display:grid;gap:6px;margin-top:8px}
.say{margin:0;background:var(--say-soft);color:var(--say);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15.5px;position:relative}
.say.pt{background:var(--surface-2);color:var(--ink);font-weight:500}
.say .who{font-size:12px;font-weight:700;margin-right:6px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.badge.sup{background:var(--sup-soft);color:var(--sup)}
.say.masked{color:transparent;text-shadow:0 0 10px rgba(15,94,140,.55);user-select:none;cursor:pointer}
.say.masked .badge,.say.masked .who{visibility:hidden}
.say.masked::after{content:"탭해서 보기";position:absolute;inset:0;display:grid;place-items:center;color:var(--say);font-size:13px;font-weight:600;text-shadow:none}
.more{margin-top:8px;display:grid;gap:6px}
.act{font-size:14px;color:var(--muted);margin:0;padding-left:2px}
.act b{color:var(--sup);font-weight:700;font-size:12px;margin-right:4px}
.tip{font-size:13.5px;margin:0;border-radius:10px;padding:7px 10px}
.tip.k2{background:var(--fix-soft)}
.tip.k3{background:var(--chk-soft)}
.tip.k1{background:var(--accent-soft)}
.tip.k0{background:var(--surface-2)}
.tip b{font-size:12px;margin-right:4px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.tog{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:6px 4px;min-height:34px}
.here{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12.5px;padding:4px 12px;min-height:32px;color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:30px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.notice{text-align:center;color:var(--muted);font-size:12.5px;margin:22px 0 6px;line-height:1.7}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(20,48,74,.08)}
.pl-in{max-width:680px;margin:0 auto}
.now{display:flex;align-items:center;gap:8px;font-size:13px;min-height:22px}
.now .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .cnt{font-family:var(--font-mono);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.cb{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:46px;height:46px;display:inline-grid;place-items:center;padding:0 10px;font-size:12.5px;font-weight:600}
.cb svg{width:22px;height:22px;fill:currentColor}
.cb.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:64px;height:52px;border-radius:16px}
.cb.play svg{width:26px;height:26px}
.cb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.st{font-size:11.5px;color:var(--muted);margin-top:5px;text-align:center;min-height:16px}

/* sleep overlay */
.night{position:fixed;inset:0;z-index:50;background:#000;color:#3a3a3a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;user-select:none;-webkit-user-select:none}
.night .nl{font-size:18px;color:#4a4a4a;max-width:520px}
.night .nh{font-size:13px;color:#333}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="hrow"><button class="back" id="bBack" hidden aria-label="목록으로">‹ 목록</button><h1 id="hTitle">간호 암기 목록</h1></div>
  <p class="sub" id="hSub">듣고 싶은 목록을 골라 주세요</p>
  <div id="deckTools" hidden>
  <div class="search"><input id="q" type="search" placeholder="검색 (예: 커프, 15초, 귓바퀴)" aria-label="검색"></div>
  <div class="chips" id="chips" role="group" aria-label="보기 범위"></div>
  </div>
</div></header>

<main class="wrap">
  <div class="vwarn" id="vwarn" hidden></div>
  <div id="acct"></div>
  <section id="home"></section>
  <section id="deckView" hidden>
  <details class="set" id="setBox">
    <summary>재생 설정 <span id="setSum"></span></summary>
    <div class="set-body">
      <div class="srow"><span class="lab">읽을 내용</span>
        <div class="seg" data-key="mode"><button data-v="all">항목 + 대사</button><button data-v="lines">대사만</button><button data-v="items">항목만</button></div></div>
      <div class="srow"><span class="lab">순서</span>
        <div class="seg" data-key="order"><button data-v="seq">정방향</button><button data-v="rand">랜덤</button></div></div>
      <div class="srow"><span class="lab">속도</span>
        <div class="seg" data-key="rate"><button data-v="0.7">느리게</button><button data-v="0.9">보통</button><button data-v="1.1">빠르게</button></div></div>
      <div class="srow"><span class="lab">한 항목 반복</span>
        <div class="seg" data-key="rep"><button data-v="1">1번</button><button data-v="2">2번</button><button data-v="3">3번</button></div></div>
      <div class="srow"><span class="lab">항목 사이 쉬는 시간</span>
        <div class="seg" data-key="gap"><button data-v="800">짧게</button><button data-v="1800">보통</button><button data-v="3500">길게</button></div></div>
      <label class="tg"><span>동작·예시도 읽기<small>괄호 속 동작, 측정값 예시</small></span><input type="checkbox" class="sw" data-key="acts"></label>
      <label class="tg"><span>대사 전에 3초 떠올리기<small>항목을 읽고 3초 쉰 뒤 대사를 읽어요</small></span><input type="checkbox" class="sw" data-key="recall"></label>
      <label class="tg"><span>화면 따라가기<small>읽는 항목으로 이동하고 자동으로 펼쳐요</small></span><input type="checkbox" class="sw" data-key="follow"></label>
      <label class="tg"><span>대사 가리기<small>스스로 떠올린 뒤 탭해서 확인 (읽는 중인 항목은 보여요)</small></span><input type="checkbox" class="sw" data-key="mask"></label>
      <label class="tg"><span>영어 단어는 영어 음성으로<small>끄면 영어 단어까지 모두 한국어 음성으로 읽어요</small></span><input type="checkbox" class="sw" data-key="enVoice"></label>
      <div class="srow"><label for="timer">끄기 타이머</label>
        <select id="timer"><option value="0">끄지 않음 (무한 반복)</option><option value="30">30분 뒤</option><option value="60">1시간 뒤</option><option value="120">2시간 뒤</option><option value="240">4시간 뒤</option><option value="480">8시간 뒤</option></select></div>
      <div class="srow"><label for="voice">한국어 음성</label><select id="voice"><option value="">자동 선택</option></select>
        <button class="here" id="bTest" type="button" style="justify-self:start;margin-top:4px">음성 테스트</button>
        <p class="note" id="voiceInfo"></p></div>
      <p class="note">밤새 틀어둘 때: 충전기를 꽂고, 재생 중에는 화면이 꺼지지 않게 유지해요. 휴대폰 화면이 꺼지거나 다른 앱으로 가면 브라우저 음성이 멈출 수 있어요. 아래 <b>취침</b> 버튼을 누르면 화면을 검게 덮은 채 계속 읽어요.</p>
    </div>
  </details>

  <div id="list"></div>
  <div id="deckSrc"></div>
  </section>
  <p class="notice">오류나 잘못된 내용은 배포자에게 알려 주세요.<br><span id="ver"></span></p>
</main>

<div class="player" id="player" role="region" aria-label="연속 재생" hidden>
  <div class="pl-in">
    <div class="now"><span class="lbl" id="nowLbl">▶ 를 누르면 보이는 목록을 처음부터 끝없이 반복해서 읽어요</span><span class="cnt" id="nowCnt"></span></div>
    <div class="ctr">
      <button class="cb" id="bOrder" aria-pressed="false" title="랜덤">랜덤</button>
      <button class="cb" id="bPrev" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="cb play" id="bPlay" aria-label="재생"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="cb" id="bNext" aria-label="다음"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button class="cb" id="bNight" title="취침 모드">취침</button>
    </div>
    <div class="st" id="st"></div>
  </div>
</div>

<div class="night" id="night" hidden>
  <div class="nl" id="nightLbl"></div>
  <div class="nh">화면을 두 번 누르면 돌아가요</div>
</div>

<script>
"use strict";
const VERSION = "1.2.0", VDATE = "2026-11-09";
/* ===== 데이터 =====
   lab: 화면 번호 / sl: 읽을 번호 / crit: 원본 * 표시
   t: 본문(원본 표기) / list: 목록 / kv: 표 / st: 본문 읽기용(선택)
   lines: 대사 [{t, sup:정리본 보충, who:'환자'}] / acts: 동작·예시 [{t, sup}]
   tips: [{k:1 원본대로 고침,2 정리본 수정 유지,3 원본 의심,0 참고, t}]
   {en:...} = 영어로 읽기 */
const SECS_VS = [

}

function koList(){ return voices.filter(v=>v.lang && /^ko/i.test(v.lang.replace("_","-"))); }
/* 간호학 단어장과 같은 방식: 기기 목록에서 첫 번째 한국어 음성 */
function pickVoice(lang){
  if(synth && !voices.length){ try{ voices = synth.getVoices()||[]; }catch(e){} }
  if(lang==="ko-KR"){
    if(S.voice){ const v = voices.find(x=>x.voiceURI===S.voice); if(v) return v; }
    return voices.filter(v=>/^ko/i.test(v.lang||""))[0] || null;
  }
  return voices.filter(v=>/^en[-_]US/i.test(v.lang||""))[0] || voices.filter(v=>/^en/i.test(v.lang||""))[0] || null;
}
function sayify(s){
  return s
    .replace(/#3\/\s*day PO/gi,"하루 3회 경구")
    .replace(/(\d+)\s*[~∼-]\s*(\d+)\s*cm/gi,"$1에서 $2 센티미터")
    .replace(/(\d+)\s*[~∼-]\s*(\d+)/g,"$1에서 $2")
    .replace(/(\d{2,3})\s*\/\s*(\d{2,3})/g,"$1에 $2")
    .replace(/\bBP\s/g,"혈압 ").replace(/\bT\s(?=\d)/g,"체온 ").replace(/\bP\s(?=\d)/g,"맥박 ").replace(/\bR\s(?=\d)/g,"호흡 ")
    .replace(/mmHg/g," 밀리미터 수은주")
    .replace(/℃/g,"도").replace(/℉/g," 화씨")
    .replace(/bulb/gi,"벌브").replace(/Initial/gi,"이니셜").replace(/T\.P\.R\.\s*CHART/gi,"티피알 차트")
    .replace(/\s\+\s/g," 더하기 ").replace(/\s=\s/g,", ")
    .replace(/→/g,", ")
    .replace(/※\s*참고\)/g,"참고.").replace(/※/g,"")
    .replace(/[\[\]()]/g,", ")
    .replace(/\//g,", ")
    .replace(/\*/g,"")
    .replace(/\s*,\s*([.?!])/g,"$1")
    .replace(/([.?!])\s*,\s*/g,"$1 ")
    .replace(/(\s*,\s*){2,}/g,", ")
    .replace(/^[\s,.]+/,"").replace(/[\s,]+$/,"")
    .replace(/\s+/g," ").trim();
}
/* "{en:...}" 를 영어 조각으로 나눔 */
function segs(text, already){
  const out = []; const re = /\{en:([^}]*)\}/g; let i=0, m;
  while((m=re.exec(text))){
    if(m.index>i) out.push({lang:"ko-KR",t:already?text.slice(i,m.index):sayify(text.slice(i,m.index))});
    out.push({lang:S.enVoice?"en-US":"ko-KR",t:m[1]}); i=re.lastIndex;
  }
  if(i<text.length) out.push({lang:"ko-KR",t:already?text.slice(i):sayify(text.slice(i))});
  /* 긴 문장은 나눠 읽기 (브라우저가 긴 문장을 중간에 끊는 문제 방지) */
  const res=[];
  out.forEach(o=>{
    const t=o.t.replace(/^[\s,.]+/,"").trim(); if(!t || /^[,.\s]+$/.test(t)) return;
    if(o.lang!=="ko-KR" || t.length<=110){ res.push({lang:o.lang,t}); return; }
    const parts = t.split(/(?<=[.?!])\s+/);
    parts.forEach(p=>{
      if(p.length<=130){ res.push({lang:o.lang,t:p}); return; }
      let buf=""; p.split(/(?<=,)\s+/).forEach(c=>{ if((buf+" "+c).length>110 && buf){ res.push({lang:o.lang,t:buf}); buf=c; } else buf = buf?buf+" "+c:c; });
      if(buf) res.push({lang:o.lang,t:buf});
    });
  });
  return res;
}
function bodyText(d){
  if(d.st) return d.st;
  if(d.t) return d.t;
  if(d.list) return d.list.join(". ");
  if(d.kv) return d.kv.map(([k,v])=>k+", "+v).join(". ");
  return "";
}
function buildSpeech(d){
  const q = [];
  const hasLines = d.lines && d.lines.length;
  const MODE = S.mode;
  if(MODE==="lines" && !hasLines){ S.mode="all"; try{ return buildSpeech(d); } finally { S.mode=MODE; } }
  q.push(...segs(d.sl+"."));
  if(S.mode!=="lines") q.push(...segs(bodyText(d)));
  if(S.mode!=="items" && hasLines){
    if(S.recall && S.mode!=="lines") q.push({pause:3000});
    q.push({lang:"ko-KR",t:"대사."});
    d.lines.forEach(l=>{
      if(l.who) q.push({lang:"ko-KR",t:l.who+" 대답."});
      q.push(...segs(l.s||l.t));
    });
  }
  if(S.acts && S.mode!=="lines" && d.acts && d.acts.length){
    d.acts.forEach(a=>q.push(...segs(a.t)));
  }
  return q;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let runTok = 0;
let noVoiceMode = false; /* 고른 음성이 오류를 내면 음성 지정 없이(언어만) 다시 읽음 */
function speakOne(seg, tok){
  return new Promise(res=>{
    if(!synth){ setTimeout(res, 600); return; }
    let done=false, w=null, retried=false;
    const fin = ()=>{ if(done) return; done=true; clearTimeout(w); res(); };
    const go = (useVoice)=>{
      const u = new SpeechSynthesisUtterance(seg.t);
      u.lang = seg.lang;
      const v = useVoice ? pickVoice(seg.lang) : null; if(v) u.voice = v;
      if(seg.lang==="ko-KR") showVoice(v);
      u.rate = parseFloat(S.rate);
      u.onend = fin;
      u.onerror = e=>{
        const er = e && e.error;
        if(er==="interrupted" || er==="canceled"){ fin(); return; }
        if(!retried && v && tok===runTok){ retried=true; noVoiceMode=true; clearTimeout(w); w=arm(); go(false); return; }
        setSt("음성 오류: "+(er||"알 수 없음")+" · 설정의 '음성 테스트'로 확인해 주세요."); fin();
      };
      synth.speak(u);
    };
    /* 안전장치: 끝 신호가 안 오면 다음으로 넘어감 (간호학 단어장과 같은 기준) */
    const arm = ()=> setTimeout(()=>{ if(tok===runTok){ try{synth.cancel();}catch(e){} } fin(); }, 5000 + seg.t.length*300/parseFloat(S.rate));
    try{ w = arm(); go(!noVoiceMode); }catch(e){ fin(); }
  });
}

let shownVoice = null;
function showVoice(v){
  const key = v ? v.voiceURI : "-"; if(key===shownVoice) return; shownVoice = key;
  $("#voiceInfo").textContent = (v ? `지금 읽는 음성: ${v.name} (${v.lang})` : noVoiceMode ? "고른 음성이 오류를 내서, 음성을 지정하지 않고 기기 기본 한국어 음성으로 읽고 있어요." :
    (voices.length ? "이 기기에서 한국어 음성을 찾지 못해 기기 기본 음성으로 읽고 있어요. 기기 설정의 텍스트 음성 변환(TTS)에서 한국어 음성을 설치해 주세요." : "기기 음성 목록을 불러오지 못해, 기기 기본 음성으로 읽고 있어요.")) + ` · 기기 음성 ${voices.length}개, 한국어 ${koList().length}개`;
}
/* ===== 재생 ===== */
let playing=false, order=[], pos=0, stopAt=0, timerIv=null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function playable(){
  let v = visible();
  if(S.mode==="lines" && D.some(d=>d.lines&&d.lines.length)) v = v.filter(d=>d.lines&&d.lines.length);
  return v.map(d=>d.id);
}
function rebuildOrder(keep){
  const ids = playable();
  const cur = order[pos];
  if(S.order==="rand"){
    order = shuffle(ids.slice());
    if(keep && cur && order.includes(cur)){ order.splice(order.indexOf(cur),1); order.unshift(cur); }
    pos = 0;
  }else{
    order = ids;
    pos = keep && cur && ids.includes(cur) ? ids.indexOf(cur) : 0;
  }
  updateNow();
}
function setCur(id){
  const prev = curId; curId = id;
  if(prev && prev!==id){
    if(autoOpen.has(prev)) autoOpen.delete(prev);
    rerenderItem(prev);
  }
  if(id){
    if(S.follow && !userOpen.has(id)) autoOpen.add(id);
    rerenderItem(id);
    if(S.follow){ const el=document.getElementById("it-"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); }
  }
  updateNow();
}
function collapseAuto(){ const ids=[...autoOpen]; autoOpen.clear(); ids.forEach(rerenderItem); }
function labelOf(d){ return d ? `${d.lab}  ${d.kind || d.t || ""}`.replace(/\s+/g," ") : ""; }
function updateNow(){
  const d = D.find(x=>x.id===(curId||order[pos]));
  $("#nowCnt").textContent = order.length ? `${Math.min(pos+1,order.length)}/${order.length}` : "0/0";
  if(playing && d) $("#nowLbl").textContent = "읽는 중 · "+labelOf(d);
  else if(d && curId) $("#nowLbl").textContent = "멈춤 · "+labelOf(d);
  $("#nightLbl").textContent = d && playing ? labelOf(d) : "멈춤";
}
async function run(tok){
  while(tok===runTok && playing){
    if(!order.length){ rebuildOrder(false); if(!order.length){ stop(); setSt("재생할 항목이 없어요. 보기 범위를 바꿔 보세요."); return; } }
    if(pos>=order.length){ /* 한 바퀴 끝 → 처음부터 다시 */
      const last = order[order.length-1];
      if(S.order==="rand"){ order = shuffle(playable()); if(order.length>1 && order[0]===last){ order.push(order.shift()); } }
      else order = playable();
      pos = 0; cycles++;
      continue;
    }
    const id = order[pos]; const d = D.find(x=>x.id===id);
    if(!d){ pos++; continue; }
    S.last = id; save();
    setCur(id);
    const reps = parseInt(S.rep,10)||1;
    for(let r=0;r<reps && tok===runTok;r++){
      const q = buildSpeech(d);
      for(const seg of q){
        if(tok!==runTok) return;
        if(seg.pause){ await sleep(seg.pause); continue; }
        await speakOne(seg, tok);
        if(tok!==runTok) return;
        await sleep(260);
      }
      if(r<reps-1) await sleep(900);
    }
    if(tok!==runTok) return;
    await sleep(parseInt(S.gap,10)||1800);
    if(tok!==runTok) return;
    pos++;
  }
}
let cycles=0;
function start(fromId){
  if(!synth){ setSt("이 브라우저에서는 음성 읽기를 쓸 수 없어요."); }
  rebuildOrder(true);
  if(fromId && order.includes(fromId)){
    if(S.order==="rand"){ order.splice(order.indexOf(fromId),1); order.unshift(fromId); pos=0; }
    else pos = order.indexOf(fromId);
  }else if(!fromId && !curId && S.last && order.includes(S.last) && S.order==="seq"){
    pos = order.indexOf(S.last);
  }
  if(synth && !voices.length){ try{ voices = synth.getVoices()||[]; }catch(e){} }
  if(!voices.length){ voiceChecked = true; paintVoiceWarn(); setSt("한국어 음성을 불러오지 못했어요 · 위쪽 안내대로 크롬에서 열어 주세요"); window.scrollTo(0,0); }
  else if(!koList().length) setSt("이 기기에 한국어 음성이 없어요 · 설정 → 텍스트 음성 변환(TTS)에서 한국어 음성을 설치해 주세요");
  playing = true; runTok++;
  try{ synth && synth.cancel(); }catch(e){}
  paintPlay(); lockOn(); armTimer();
  run(runTok);
}
function stop(){
  playing=false; runTok++;
  try{ synth && synth.cancel(); }catch(e){}
  paintPlay(); lockOff(); disarmTimer();
  collapseAuto();
  updateNow();
}
function jump(delta){
  if(!order.length) rebuildOrder(true);
  if(!order.length) return;
  pos = (pos + delta + order.length) % order.length;
  if(playing){ runTok++; try{synth.cancel();}catch(e){} run(runTok); }
  else setCur(order[pos]);
}
function paintPlay(){
  $("#playIco").innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
  $("#bPlay").setAttribute("aria-label", playing?"정지":"재생");
}

/* 화면 켜짐 유지 */
let wl=null, wlState="";
async function lockOn(){
  if(!("wakeLock" in navigator)){ wlState="na"; paintSt(); return; }
  try{
    wl = await navigator.wakeLock.request("screen"); wlState="on";
    wl.addEventListener("release",()=>{ if(wlState==="on"){ wlState="off"; paintSt(); } });
  }catch(e){ wlState="blocked"; }
  paintSt();
}
function lockOff(){ wlState=""; try{ wl && wl.release(); }catch(e){} wl=null; paintSt(); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && playing && wlState!=="on") lockOn(); });
let stMsg="";
function setSt(m){ stMsg=m; paintSt(); }
function paintSt(){
  let t = stMsg;
  if(!t && playing){
    const w = wlState==="on" ? "화면 켜짐 유지 중" : "화면 켜짐 유지를 이 화면에서 켤 수 없어요 · 휴대폰 '화면 자동 꺼짐'을 길게 해 주세요";
    const tm = stopAt ? ` · ${Math.max(0,Math.ceil((stopAt-Date.now())/60000))}분 뒤 꺼짐` : " · 끝없이 반복";
    t = w + tm;
  }
  $("#st").textContent = t;
}
function armTimer(){
  disarmTimer();
  const m = parseInt($("#timer").value,10)||0;
  stopAt = m ? Date.now()+m*60000 : 0;
  timerIv = setInterval(()=>{ if(stopAt && Date.now()>=stopAt){ stop(); $("#timer").value="0"; setSt("끄기 타이머로 멈췄어요."); } else paintSt(); }, 15000);
  paintSt();
}
function disarmTimer(){ clearInterval(timerIv); timerIv=null; stopAt=0; }

/* ===== 이벤트 ===== */
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  S.sec=b.dataset.k; save(); render(); rebuildOrder(true);
});
let qT=null;
$("#q").addEventListener("input",()=>{ clearTimeout(qT); qT=setTimeout(()=>{ render(); rebuildOrder(true); },200); });
listEl.addEventListener("click",e=>{
  const st=e.target.closest("[data-star]");
  if(st){ const id=st.dataset.star; if(S.stars[id]) delete S.stars[id]; else S.stars[id]=1; S.stT=S.stT||{}; S.stT[id]=Date.now(); S.dd=S.dd||{st:{}}; S.dd.st=S.dd.st||{}; S.dd.st[id]=1; changed(); st.setAttribute("aria-pressed",!!S.stars[id]); renderChips(); if(S.sec==="star"){ render(); rebuildOrder(true);} return; }
  const tg=e.target.closest("[data-tog]");
  if(tg){ const id=tg.dataset.tog; const open=userOpen.has(id)||autoOpen.has(id);
    if(open){ userOpen.delete(id); autoOpen.delete(id); } else userOpen.add(id);
    rerenderItem(id); return; }
  const hr=e.target.closest("[data-here]");
  if(hr){ start(hr.dataset.here); return; }
  const sy=e.target.closest(".say.masked");
  if(sy){ revealed.add(sy.dataset.key); sy.classList.remove("masked"); }
});
$("#bPlay").addEventListener("click",()=>{ setSt(""); playing?stop():start(null); });
$("#bPrev").addEventListener("click",()=>jump(-1));
$("#bNext").addEventListener("click",()=>jump(1));
$("#bOrder").addEventListener("click",()=>{
  S.order = S.order==="rand"?"seq":"rand"; cfgChanged("order");
  document.querySelectorAll('.seg[data-key="order"] button').forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===S.order));
  afterSetting("order");
});
$("#timer").addEventListener("change",()=>{ if(playing) armTimer(); });
$("#voice").addEventListener("change",e=>{ S.voice=e.target.value; noVoiceMode=false; shownVoice=null; save(); });
$("#bTest").addEventListener("click",()=>{
  if(!synth){ $("#voiceInfo").textContent="이 브라우저에서는 음성 읽기를 쓸 수 없어요."; return; }
  if(playing) stop();
  try{ synth.cancel(); const u=new SpeechSynthesisUtterance("음성 테스트입니다. 들리시나요?"); u.lang="ko-KR"; const v=pickVoice("ko-KR"); if(v) u.voice=v; shownVoice=null; showVoice(v); u.rate=parseFloat(S.rate);
    u.onerror=e=>{ $("#voiceInfo").textContent="음성 오류: "+(e.error||"알 수 없음"); };
    synth.speak(u); }catch(e){ $("#voiceInfo").textContent="음성 오류: "+e.message; }
});
$("#bNight").addEventListener("click",()=>{ $("#night").hidden=false; updateNow(); });
let lastTap=0;
$("#night").addEventListener("click",()=>{ const n=Date.now(); if(n-lastTap<600){ $("#night").hidden=true; } lastTap=n; });

/* 시작 */
$("#ver").textContent = `버전 ${VERSION} (${VDATE})`;
$("#bOrder").setAttribute("aria-pressed", S.order==="rand");
try{ if(!localStorage.getItem(LS)) $("#setBox").open = true; }catch(e){ $("#setBox").open = true; }
bindSettings(); updateSum();
if(S.deck && DECKS.some(k=>k.id===S.deck)) openDeck(S.deck); else goHome();
if(synth){ loadVoices(); try{ synth.addEventListener("voiceschanged", loadVoices); }catch(e){ synth.onvoiceschanged = loadVoices; } setTimeout(loadVoices, 1000); setTimeout(()=>{ voiceChecked = true; loadVoices(); }, 3000); } else setSt("이 브라우저에서는 음성 읽기를 쓸 수 없어요.");
window.KN = { get S(){ return S; }, save: ()=>save(), refresh: ()=>refreshAll() };
window.__VS = {get D(){return D;}, openDeck, goHome, buildSpeech, sayify, segs, get order(){return order;}, get pos(){return pos;}, get cur(){return curId;}};
</script>
